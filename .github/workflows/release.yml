name: Build and Attach Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore TaskbarGroups.sln

      - name: Build Release
        run: msbuild TaskbarGroups.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package binaries
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "TaskbarGroups-$tag.zip"
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -Path "main\bin\Release\*" -Destination "staging" -Recurse
          Get-ChildItem -Path "staging" -Filter "*.pdb" -Recurse | Remove-Item -Force
          Compress-Archive -Path "staging\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create Release and Upload Archive
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

