name: Build and Attach Release Assets

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version and Tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $rawVer = $tag.TrimStart('v', 'V')
            $parts = $rawVer.Split('.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $ver = ($parts[0..3] -join '.')
            [System.IO.File]::WriteAllText("VERSION", $ver + [Environment]::NewLine)
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
            Write-Host "Manual tag release: $tag (assembly version $ver)"
          } else {
            $ver = (Get-Content "VERSION" -Raw).Trim()
            $tag = "v$ver"
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ([string]::IsNullOrWhiteSpace($existing)) {
              echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
              echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
              Write-Host "New version detected in VERSION: $tag — will build and release."
            } else {
              echo "SHOULD_RELEASE=false" >> $env:GITHUB_ENV
              Write-Host "Tag $tag already exists — skipping automatic release."
            }
          }

      - name: Setup NuGet
        if: env.SHOULD_RELEASE == 'true'
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        if: env.SHOULD_RELEASE == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        if: env.SHOULD_RELEASE == 'true'
        run: nuget restore TaskbarGroups.sln

      - name: Build Release
        if: env.SHOULD_RELEASE == 'true'
        run: msbuild TaskbarGroups.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SkipVersionIncrement=true /m

      - name: Package binaries
        if: env.SHOULD_RELEASE == 'true'
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $zipName = "TaskbarGroups-$tag.zip"
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -Path "main\bin\Release\*" -Destination "staging" -Recurse
          Get-ChildItem -Path "staging" -Filter "*.pdb" -Recurse | Remove-Item -Force
          Compress-Archive -Path "staging\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create Release and Upload Archive
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
